name: 积分看板自动更新

# 触发方式（2026-10-20 实时化，DeepSeek 终审放行）：
# - on: push 全天候触发：台账变更 → build_stats 生成 → push → 本 workflow 部署，
#   workflow 层不再有时间窗口门控（原 schedule 定时触发段已删除）。
#   注（DeepSeek 裁定1 2026-10-20）：窗口闸门在脚本层——build_stats/sync_sections/
#   build_trends 的 main() 在 [00:00,06:00) 静默窗内 skip（BUILD_SILENT_WINDOW 单点
#   定义），与本 workflow 的全天候触发不冲突：workflow 照常被 push 触发，夜间无新
#   push 产生是因为脚本层闸门，不是 workflow 门控。
# - workflow_dispatch 保留（手动演练/兜底）。
# - 月消耗改为"仅变更触发"，随台账变更频率浮动；原定时消耗（约700-1400 分钟/月）归零。
#
# 2026-10-19 迁移记录（用户批准）：
#   新版看板（全新版式样板）上线，替换旧版。
#   自动更新逻辑变更：定时触发 → 部署 templates/新样板（静态） + 同步 data/tasks_daily_*.json；
#   Drive 台账拉取与旧 build_wrapper.py 生成逻辑停用（脚本保留）。

on:
  push:
    branches: [master]
  workflow_dispatch:  # 允许手动触发

# 并发收敛：新 push 取消在途旧部署（旧部署已被新 commit 超越，无需跑完；纯静态部署无副作用；2026-10-20 DeepSeek 终审）
concurrency:
  group: kanban-update
  cancel-in-progress: true

# DeepSeek 安全加固：默认最小权限，各 job 按需声明
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # 仅需检出代码
    steps:
      # 第三方 action 固定到 commit SHA（防 tag 劫持，DeepSeek 加固）
      # SHA 已用 git ls-remote 核验（2026-10-18）
      - name: 检出代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # 清单对账（2026-10-20 审计修复1，DeepSeek方案）：
      # 前端 fetch 的 data/*.json 必须都在本 workflow 的拷贝清单内，漏配即构建失败，
      # 防 trends.json 式静默 404 复发。脚本只认拷贝语义 token，注释提及不算。
      - name: 数据清单对账
        run: python3 scripts/check_data_manifest.py

      # 2026-10-19 新版看板上线（用户指令：删掉旧积分看板，部署全新版式样板）：
      # 部署产物 = templates/ 下新样板 HTML（单文件，静态演示数据）；
      # 旧 build_wrapper.py 生成逻辑停用（脚本保留为 fallback，不再调用）；
      # Drive 台账拉取停用（新样板不消费台账）。
      - name: 部署新版看板样板到 Pages 产物
        run: |
          mkdir -p public
          cp "templates/积分看板_全新版式样板.html" public/index.html
          cp CNAME public/CNAME
          # 主屏幕图标（2026-10-20 用户提供）：iOS 读取根路径 /apple-touch-icon.png；
          # favicon 供浏览器标签页使用。硬断言文件非空，防上线缺图。
          test -s apple-touch-icon.png || { echo "::error::apple-touch-icon.png 缺失或为空"; exit 1; }
          test -s favicon-32.png || { echo "::error::favicon-32.png 缺失或为空"; exit 1; }
          cp apple-touch-icon.png favicon-32.png public/
          ls -la public/

      # 今日任务数据通道（KB-TASK-AUTO-2026-10-19）：
      # 将仓库 data/ 下的 tasks_daily_*.json 同步进 Pages 产物，供新版看板 fetch。
      # 仅拷贝当日任务表（无积分字段），不含脚本/日志/台账。
      # 硬断言：文件缺失或为空则构建失败（防静默上线坏数据）。
      - name: 同步今日任务表到 Pages 产物
        run: |
          mkdir -p public/data
          test -s data/tasks_daily_5.json || { echo "::error::data/tasks_daily_5.json 缺失或为空"; exit 1; }
          test -s data/tasks_daily_6.json || { echo "::error::data/tasks_daily_6.json 缺失或为空"; exit 1; }
          cp data/tasks_daily_5.json data/tasks_daily_6.json public/data/
          cp data/yesterday_done_5.json data/yesterday_done_6.json public/data/
          ls -la public/data/

      # 待改正配图通道（2026-10-22 家长定）：待改正明细的画图引导图
      # data/diagrams/ 同步进 Pages 产物，供明细里的 <img> 引用；
      # 目录不存在或为空时跳过（不阻断构建）。
      - name: 同步待改正配图到 Pages 产物
        run: |
          if [ -d data/diagrams ]; then
            mkdir -p public/data/diagrams
            cp data/diagrams/*.png public/data/diagrams/ 2>/dev/null || true
            ls -la public/data/diagrams/ || true
          fi

      # 旧天空素材通道已于 2026-10-28 随新版天气 Canvas 上线清理：
      # data/sky（GPT 图层）与 data/livesky（渲染壳）均已无人引用、已从仓库删除，
      # 此处两步硬断言同步删除，否则缺文件会让每次构建失败。旧图备份在 /tmp/old_sky_backup_20261028，git 历史亦可恢复。

      # 读背示范录音通道（2026-10-22 家长定）：待改正明细里的示范录音
      # data/audio/ 同步进 Pages 产物，供明细里的 <audio> 引用；
      # 目录不存在或为空时跳过（不阻断构建）。
      # 练习文件下载通道（2026-10-22 家长定）：任务卡挂的练习文件（Word/PDF）
      # data/files/ 同步进 Pages 产物，供任务卡下载打印；目录不存在或为空时跳过。
      - name: 同步练习文件到 Pages 产物
        run: |
          if [ -d data/files ]; then
            mkdir -p public/data/files
            cp data/files/* public/data/files/ 2>/dev/null || true
            ls -la public/data/files/ || true
          fi

      - name: 同步读背示范录音到 Pages 产物
        run: |
          if [ -d data/audio ]; then
            mkdir -p public/data/audio
            cp data/audio/* public/data/audio/ 2>/dev/null || true
            ls -la public/data/audio/ || true
          fi

      # 已完成任务原图通道（2026-10-22 家长定，三方定案）：任务卡「查看原图」
      # 的高清查看版 data/orig/ 同步进 Pages 产物；目录不存在或为空时跳过。
      - name: 同步已完成任务原图到 Pages 产物
        run: |
          if [ -d data/orig ]; then
            mkdir -p public/data/orig
            cp data/orig/* public/data/orig/ 2>/dev/null || true
            ls -la public/data/orig/ || true
          fi

      # 看板真实数据通道（KB-STATS-AUTO-2026-10-19，DeepSeek终审 B1/R1/R3）：
      # 同步 data/stats_grade_*.json、points_log_*.json、shop_grade_*.json 进 Pages 产物。
      # 硬断言：文件缺失/为空/schema异常/敏感词命中任一即构建失败（余额是家长最敏感字段，不允许静默坏数据）。
      # 断言逻辑与生成端共用 scripts/_assert_lib.py（同一份词表+schema，B5双写）。
      - name: 同步看板真实数据到 Pages 产物
        run: |
          mkdir -p public/data
          cp data/stats_grade_5.json data/stats_grade_6.json public/data/
          cp data/points_log_5.json data/points_log_6.json public/data/
          cp data/shop_grade_5.json data/shop_grade_6.json public/data/
          python3 scripts/workflow_assert.py
          ls -la public/data/

      # 全栏目数据通道（KB-SECTIONS-AUTO-2026-10-19）：
      # 同步 data/badges.json、badge_goals.json、shop.json、rules.json 进 Pages 产物。
      # 硬断言（P1#8，DeepSeek 审查 2026-10-20）：缺失/校验失败即构建失败并点名
      # 文件。原"软断言照绿"曾让 badges.json 在远端静默消失数日无人知。
      - name: 同步全栏目数据到 Pages 产物
        run: |
          mkdir -p public/data
          python3 - <<'PYEOF'
          import json, sys
          files = {
            'data/badges.json': lambda d: (
              d.get('schema_version') == 1 and 'by_grade' in d
              and set(d['by_grade'].keys()) == {'g5', 'g6'}),
            'data/badge_goals.json': lambda d: (
              d.get('schema_version') == 1 and isinstance(d.get('catalog'), list)
              and len(d['catalog']) >= 1 and 'by_grade' in d
              and set(d['by_grade'].keys()) == {'g5', 'g6'}),
            'data/shop.json': lambda d: (
              d.get('schema_version') == 1 and isinstance(d.get('items'), list)
              and len(d['items']) > 0),
            'data/rules.json': lambda d: (
              d.get('schema_version') == 1 and isinstance(d.get('add'), list)
              and isinstance(d.get('deduct'), list)),
            'data/redeem_log.json': lambda d: (
              d.get('schema_version') == 1 and d.get('window_days') == 15
              and 'by_grade' in d
              and set(d['by_grade'].keys()) == {'g5', 'g6'}),
          }
          for path, check in files.items():
              try:
                  with open(path, encoding='utf-8') as f:
                      d = json.load(f)
                  assert check(d), 'schema 校验失败'
              except Exception as e:
                  print('::error::' + path + ' 缺失或校验失败（' + str(e)[:80] + '），构建失败')
                  sys.exit(1)
              print('OK ' + path)
              import shutil
              shutil.copy(path, 'public/' + path)
          PYEOF
          ls -la public/data/

      # 学习走势数据通道（2026-10-20，DeepSeek方案）：
      # 同步 data/trends.json 进 Pages 产物。硬断言（P1#8，DeepSeek 审查
      # 2026-10-20）：缺失/校验失败即构建失败并点名文件，不再软断言照绿。
      - name: 同步学习走势数据到 Pages 产物
        run: |
          mkdir -p public/data
          python3 - <<'PYEOF'
          import json, shutil, sys
          p = 'data/trends.json'
          try:
              with open(p, encoding='utf-8') as f:
                  d = json.load(f)
              assert isinstance(d.get('dates'), list) and len(d['dates']) == 30, 'dates 须为30天'
              assert set(d.get('grades', {}).keys()) == {'五年级', '六年级'}, 'grades 缺年级'
              for gr in d['grades'].values():
                  assert isinstance(gr.get('overall'), list) and len(gr['overall']) == 30, 'overall 须为30天'
          except Exception as e:
              print('::error::' + p + ' 缺失或校验失败（' + str(e)[:80] + '），构建失败')
              sys.exit(1)
          print('OK ' + p)
          shutil.copy(p, 'public/' + p)
          PYEOF
          ls -la public/data/

      # 学习小结数据通道（2026-10-23 家长拍板两版上看板）：孩子版小结
      # data/daily_summary_*.json 同步进 Pages 产物；家长版数据不走此通道
      # （只存 Worker KV、私有拉取，绝不进公开仓库）。硬断言防静默缺失。
      - name: 同步学习小结数据到 Pages 产物
        run: |
          mkdir -p public/data
          test -s data/daily_summary_5.json || { echo "::error::data/daily_summary_5.json 缺失或为空"; exit 1; }
          test -s data/daily_summary_6.json || { echo "::error::data/daily_summary_6.json 缺失或为空"; exit 1; }
          cp data/daily_summary_5.json data/daily_summary_6.json public/data/
          cp data/summary_status.json public/data/ 2>/dev/null || true
          ls -la public/data/

      # 批改反馈数据通道（2026-10-23 家长知情改定全搬）：data/feedback_*.json
      - name: 同步批改反馈数据到 Pages 产物
        run: |
          mkdir -p public/data
          test -s data/feedback_5.json || { echo "::error::data/feedback_5.json 缺失或为空"; exit 1; }
          test -s data/feedback_6.json || { echo "::error::data/feedback_6.json 缺失或为空"; exit 1; }
          cp data/feedback_5.json data/feedback_6.json public/data/
          ls -la public/data/

      # 本周学习周报数据通道（2026-10-26 家长令：由批改反馈移入学习小结）：
      # data/weekly_*.json 同步进 Pages 产物，供学习小结栏目直接渲染。硬断言防静默缺失。
      - name: 同步本周学习周报数据到 Pages 产物
        run: |
          mkdir -p public/data
          test -s data/weekly_5.json || { echo "::error::data/weekly_5.json 缺失或为空"; exit 1; }
          test -s data/weekly_6.json || { echo "::error::data/weekly_6.json 缺失或为空"; exit 1; }
          cp data/weekly_5.json data/weekly_6.json public/data/
          ls -la public/data/

      # 全栏目单测（KB-SECTIONS-AUTO-2026-10-19，DeepSeek终审建议）：
      # 跨周边界定值测试必跑，防止周界回归。失败则构建失败。
      - name: 全栏目跨周边界单测
        run: |
          python3 scripts/test_sections_week.py



      # iOS27皮肤CSS同步（2026-10-25 家长令，安装包版本上线）：模板引用 /ios27-skin.css，须拷进 Pages 产物根目录，缺失即构建失败
      - name: 同步iOS27皮肤CSS到 Pages 产物
        run: |
          cp ios27-skin.css public/ios27-skin.css
          test -s public/ios27-skin.css || { echo "::error::public/ios27-skin.css 缺失，皮肤不生效"; exit 1; }

      # 产物断言（DeepSeek 部署要求）：CNAME、数据文件、新版标识缺一即失败
      - name: 产物断言
        run: |
          test -f public/CNAME || { echo "::error::public/CNAME 缺失，域名将失效"; exit 1; }
          grep -q "whyjjf.lol" public/CNAME || { echo "::error::public/CNAME 内容异常"; exit 1; }
          test -f public/data/tasks_daily_5.json || { echo "::error::public/data/tasks_daily_5.json 缺失"; exit 1; }
          test -f public/data/tasks_daily_6.json || { echo "::error::public/data/tasks_daily_6.json 缺失"; exit 1; }
          grep -q "全新版式" public/index.html || { echo "::error::public/index.html 非新版看板"; exit 1; }
          echo "产物断言全部通过"

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: public/
        # 说明：upload-pages-artifact 仅打包 public/index.html，
        # 不含脚本/日志/台账；失败时不上传调试产物（防 PII 外泄，
        # DeepSeek 安全要求 2026-10-18）。调试看 Actions 日志
        #（私有仓库，仅协作者可见）。

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write      # 部署到 GitHub Pages 所需
      id-token: write   # deploy-pages OIDC 认证所需
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4

      - name: 记录部署 commit（2026-10-20 实时化观察用）
        run: echo "deployed commit ${{ github.sha }}"
