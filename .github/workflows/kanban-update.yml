name: 积分看板自动更新

# 用户时间表（北京时间 CST = UTC+8，cron 用 UTC）：
# - 上学工作日：19:00-23:00 CST（11:00-15:00 UTC），每15分钟，周一到周五
#   实际触发：11:00-14:45 每15分钟 + 15:00 收尾一次（= CST 19:00-22:45 + 23:00）
# - 上学周末：09:00-23:00 CST（01:00-15:00 UTC），每15分钟，周六周日
#   实际触发：01:00-14:45 每15分钟 + 15:00 收尾一次（= CST 09:00-22:45 + 23:00）
# - 假期：同周末时间表。假期的工作日仍会按工作日 cron 触发（接受额度浪费，不改代码）
# - 寒暑假时间用户另行通知后调整
# 月消耗约 700-1400 分钟，在 2000 免费额度内
#
# 2026-10-18 迁移记录（用户批准）：
#   香港免费空间架构性不支持 SFTP/FTPS（仅明文 FTP，安全原因禁用），
#   部署通道由"FTP 上传"改为"GitHub Pages"。
#   自动更新逻辑不变：定时触发 → Drive 拉取台账 → 重新生成 HTML → 发布。

on:
  push:
    branches: [master]
  schedule:
    # 工作日 CST 19:00-22:45（UTC 11:00-14:45），每15分钟
    - cron: '*/15 11-14 * * 1-5'
    # 工作日 CST 23:00 收尾一次（UTC 15:00）
    - cron: '0 15 * * 1-5'
    # 周末 CST 09:00-22:45（UTC 01:00-14:45），每15分钟
    - cron: '*/15 1-14 * * 0,6'
    # 周末 CST 23:00 收尾一次（UTC 15:00）
    - cron: '0 15 * * 0,6'
  workflow_dispatch:  # 允许手动触发

# 防并发：上一次未跑完时排队，不并行
concurrency:
  group: kanban-update
  cancel-in-progress: false

# DeepSeek 安全加固：默认最小权限，各 job 按需声明
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # 仅需检出代码
    steps:
      # 第三方 action 固定到 commit SHA（防 tag 劫持，DeepSeek 加固）
      # SHA 已用 git ls-remote 核验（2026-10-18）
      - name: 检出代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: 设置 Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install "cryptography==42.0.5"

      - name: 从 Google Drive 拉取积分台账
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
        run: |
          python3 scripts/fetch_ledger.py

      - name: 重新生成看板 HTML（含完整性校验）
        run: |
          python3 scripts/build_wrapper.py
          mkdir -p public
          mv index.html public/index.html
          ls -la public/

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: public/
        # 说明：upload-pages-artifact 仅打包 public/index.html，
        # 不含脚本/日志/台账；失败时不上传调试产物（防 PII 外泄，
        # DeepSeek 安全要求 2026-10-18）。调试看 Actions 日志
        #（私有仓库，仅协作者可见）。

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write      # 部署到 GitHub Pages 所需
      id-token: write   # deploy-pages OIDC 认证所需
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
